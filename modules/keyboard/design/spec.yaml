schema_version: rea-hardware/spec/v1
product:
  slug: compact-58key-keyboard
  name: Compact 58-key mechanical desktop keyboard
  summary: Stepped beige/warm-grey 58-key Cherry MX mechanical keyboard (338x148x48 mm) with RP2040 MCU,
    full diode matrix, sculpted keycaps, and rear USB-C device port
  category: computer keyboard
view:
  up:
  - 0
  - 0
  - 1
  front:
  - 0
  - -1
  - 0
inputs:
  images:
  - inputs/front.jpg
  - inputs/three_quarter_dark.jpg
  views:
    front: inputs/front.jpg
  prompt: inputs/prompt.md
envelope:
  width_mm: 338.0
  height_mm: 148.0
  depth_mm: 48.0
  corner_radius_mm: 5.0
  derivation: Published dimensions of the classic 58-key compact desktop keyboard (M0110 class, 338 x
    148 x 48 mm) and system module contract; 15u x 19.05 mm = 285.75 mm key well with 26.125 mm side bezels
    = 338.0 mm width.
  front_origin_world_mm:
  - -14.0
  - 2.0
  - 34.0
fidelity:
  out_of_scope:
  - recessed front-left brand logo badge on lower left bezel
  - coiled RJ11 telephone-style keyboard cord (replaced by rear USB-C port P_KB_DEV per system spec)
  - internal sheet-metal switch mounting plate (switches are PCB-mounted on 1.6 mm FR-4)
  - textured injection-mold grain finish
  dimensions:
  - name: overall_width
    kind: overall_width
    value_mm: 338.0
    tol_mm: 2.0
    source: System module contract and M0110 published width (338 mm)
  - name: overall_height
    kind: overall_height
    value_mm: 48.0
    tol_mm: 2.0
    source: System module contract and M0110 published height along view.up [0,0,1] (48 mm)
  - name: overall_depth
    kind: overall_depth
    value_mm: 148.0
    tol_mm: 2.0
    source: System module contract and M0110 published depth along view.front [0,-1,0] (148 mm)
