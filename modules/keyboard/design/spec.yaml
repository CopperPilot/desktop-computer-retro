fab:
  profile: jlcpcb
  layers: 2
  thickness_mm: 1.6
  assembly_sides:
  - top
  - bottom
electrical:
  mcu: RP2040 (LCSC C2040)
  power: VBUS_RAW (from rear USB-C receptacle J1 with 5.1k CC1/CC2 pull-downs and local 100 nF high-frequency
    ESD decoupling capacitor C17 immediately adjacent to J1 ahead of F1) -> F1 (BSMD0805-050-24V 500 mA
    PTC resettable fuse) -> 5V_USB_KB (5.0 V up to 0.5 A with fuse-coordinated PTVS5V0S1UR-FS low-clamping
    unidirectional TVS diode D60, USBLC6-2SC6 ESD array U4 pin 5 VBUS reference, and 2.2 uF C1 at U3)
    -> LDL1117S33R 18V-input low-IQ SOT-223-4 LDO (U3, C435835) -> 3V3_KB (3.3 V up to 0.25 A continuous
    with 4.7 uF C2) feeding RP2040 and W25Q128JVSIQ flash
  blocks:
  - id: usb_power
    purpose: Rear-edge USB-C 2.0 receptacle (J1, port P_KB_DEV), 5.1 kOhm CC1/CC2 UFP pull-down resistors
      (R1, R2), local 100 nF high-frequency ESD decoupling capacitor (C17) on VBUS_RAW at J1 ahead of
      F1, USBLC6-2SC6 ESD protection (U4) placed immediately adjacent to J1 with in-line flow-through
      routing on USB_CONN_DP/USB_CONN_DM and pin 5 (VBUS) referenced to 5V_USB_KB behind F1, 500 mA PTC
      resettable fuse (F1, BSMD0805-050-24V), fuse-coordinated PTVS5V0S1UR-FS 5.0 V unidirectional TVS
      diode (D60, V_CL <= 9.2 V at 43.6 A) and 2.2 uF LDO input decoupling (C1) on 5V_USB_KB downstream
      of F1, and 18 V operating / 20 V abs-max, low-IQ (250 uA typ), low-dropout (350 mV typ at 1.2 A)
      SOT-223-4 LDO regulator (U3, LDL1117S33R, C435835) with 4.7 uF output cap (C2) generating 3V3_KB
      (up to 0.25 A continuous) from 5V_USB_KB
    key_parts:
    - TYPE-C-31-M-12 (C165948)
    - PTVS5V0S1UR-FS (C5380694)
    - BSMD0805-050-24V (C910822)
    - USBLC6-2SC6 (C2827654)
    - LDL1117S33R (C435835)
    - 0402WGF5101TCE (C25905)
    reference: https://datasheets.raspberrypi.com/rp2040/hardware-design-with-rp2040.pdf (Raspberry Pi
      Hardware Design with RP2040, Section 2.1-2.3)
  - id: mcu_core
    purpose: RP2040 microcontroller (U1) with 12 MHz SMD3225 crystal (Y1 ABM8-272-T3, CL=10pF, ESR<=50Ohm
      + 12 pF load caps C15/C16 + 1 kOhm damping R5), 16 MB QSPI flash W25Q128JVSIQ (U2) with 10 kOhm
      QSPI_SS_N pull-up resistor (R7) to 3V3_KB, 10 kOhm RUN pull-up resistor (R8) to 3V3_KB, 27 Ohm USB
      D+/D- series termination (R3, R4) adjacent to U1 pins 46/47, and bottom-side BOOTSEL button (SW59
      + 1 kOhm R6)
    key_parts:
    - RP2040 (C2040)
    - W25Q128JVSIQ (C97521)
    - ABM8-272-T3 (C20625731)
    - TS-1187A-B-A-B (C318884)
    - 0402WGF1002TCE (C25744)
    reference: https://datasheets.raspberrypi.com/rp2040/hardware-design-with-rp2040.pdf (Minimal RP2040
      Reference Design)
  - id: key_matrix
    purpose: 5-row by 14-column full anti-ghosting diode keymatrix wiring all 58 Cherry MX keyswitches
      (SW1..SW58) and 58 1N4148W SOD-123 diodes (D1..D58) to 19 RP2040 GPIOs (ROW0..ROW4 on GPIO0..GPIO4,
      COL0..COL13 on GPIO5..GPIO18)
    key_parts:
    - CPG151101D06 (C49234237)
    - 1N4148W (C81598)
    reference: https://github.com/qmk/qmk_firmware/blob/master/docs/how_a_matrix_works.md (Standard QMK
      COL2ROW diode matrix)
  nets_must_connect:
  - - J1.A5
    - R1.1
  - - J1.B5
    - R2.1
  - - U1.USB_DP
    - R3.1
  - - U1.USB_DM
    - R4.1
  - - U1.QSPI_SS
    - U2.CS
  - - U1.XIN
    - Y1.1
  high_speed:
  - name: usb_dp_dm
    nets:
    - '*USB_D*'
    - '*USB_CONN_*'
    - '*D+*'
    - '*D-*'
    - '*DP*'
    - '*DM*'
    kind: diff_pairs
    tolerance_mm: 1.5
    diff_impedance_ohm: 90.0
    source: 'RP2040 Datasheet Section 2.8.2 & USB 2.0 Specification: 90 Ohm +/-15% differential impedance'
