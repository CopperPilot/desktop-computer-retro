requirements:
- id: R1
  text: 'Stepped beige/warm-grey compact 58-key mechanical desktop keyboard (338x148x48 mm) with view
    {up: [0,0,1], front: [0,-1,0]}'
  how_met: 'Envelope 338.0 x 148.0 x 48.0 mm with desk orientation view {up: [0,0,1], front: [0,-1,0]}
    and two-piece stepped beige enclosure (#e5dec9 / #d8d0c0)'
  quantity: 338.0 x 148.0 x 48.0 mm
- id: R2
  text: 58 Cherry MX-style mechanical keyswitches (stock Button_Switch_Keyboard:SW_Cherry_MX_*_PCB footprints
    with 3D models generated by rea_hardware.cad.keyswitch_model()) in classic 5-row 58-key layout
  how_met: SW1..SW58 using Kailh CPG151101D06 (C49234237) on stock Button_Switch_Keyboard:SW_Cherry_MX_{1.00u,1.25u,1.50u,1.75u,2.00u,2.25u,2.75u,6.25u}_PCB
    footprints across 5 rows (14+14+13+12+5 = 58 keys)
  quantity: 58 switches, 5 rows
- id: R3
  text: Sculpted keycaps and legends (rea_hardware.cad.keycap(width_u, legend)) and one push actuator
    per key
  how_met: 58 keycaps in case/out/keycaps.stl with legends in case/out/keycaps_legends.stl and 58 push
    actuators A_K01..A_K58 along [0, 0, -1]
  quantity: 58 keycaps + 58 push actuators
- id: R4
  text: Full row/column diode matrix into an RP2040 MCU (with external QSPI flash, 12 MHz crystal, 3.3
    V LDO from 5 V VBUS, and bottom-accessible BOOTSEL flashing button)
  how_met: 5x14 diode matrix (58x 1N4148W C81598) into RP2040 (U1, C2040) with W25Q128JVSIQ 16 MB QSPI
    flash (U2, C97521) and 10k QSPI_SS_N pull-up (R7, C25744), 12 MHz crystal (Y1, ABM8-272-T3, C20625731),
    LDL1117S33R 18V-input low-IQ SOT-223-4 LDO (U3, C435835), 500 mA VBUS PTC fuse (F1, C910822) with
    fuse-coordinated PTVS5V0S1UR-FS TVS clamp (D60, C5380694), and bottom tactile switch SW59 (C318884)
    with actuator A_BOOTSEL
  quantity: 1x RP2040, 58x 1N4148W, 1x 16MB QSPI, 1x 12MHz XTAL, 1x 3.3V LDO, 1x BOOTSEL button
- id: R5
  text: Connects to the desktop via a rear-edge USB-C receptacle (port P_KB_DEV) with 5.1k CC1/CC2 pull-downs,
    ESD protection, and 90-ohm differential USB D+/D- routing
  how_met: TYPE-C-31-M-12 (J1, C165948) on rear edge (+Y, feature P_KB_DEV) with 2x 5.1 kOhm pull-downs
    (R1/R2, C25905), 100 nF high-frequency ESD decoupling on VBUS_RAW at J1 (C17, C1525), 500 mA PTC fuse
    (F1, C910822), fuse-coordinated PTVS5V0S1UR-FS 5.0 V unidirectional TVS clamp on 5V_USB_KB (D60, C5380694),
    USBLC6-2SC6 ESD array (U4, C2827654) immediately adjacent to J1 with pin 5 on 5V_USB_KB, 27 Ohm series
    terminations (R3/R4, C25156), and 90 Ohm usb_dp_dm diff_pairs rule
  quantity: 1x USB-C port (P_KB_DEV), 90 Ohm diff pair
decisions:
- question: Exact 5-row 58-key layout and unit widths?
  choice: 'Row 1 (14 keys, 15u): 13x 1.0u (`~`, `1`..`0`, `-`, `=`) + 1x 2.0u (`Backspace`); Row 2 (14
    keys, 15u): 1.5u `Tab` + 12x 1.0u (`Q`..`]`) + 1.5u `\`; Row 3 (13 keys, 15u): 1.75u `Caps Lock` +
    11x 1.0u (`A`..`''`) + 2.25u `Return`; Row 4 (12 keys, 15u): 2.25u `Shift` + 10x 1.0u (`Z`..`/`) +
    2.75u `Shift`; Row 5 (5 keys, indented 1.25u from left): 1.25u `Option` + 1.5u `Command` + 6.25u `Space`
    + 1.5u `Enter` + 1.25u `Option`.'
  reason: Matches the 58 keys and seam alignments visible in inputs/front.jpg and inputs/three_quarter_dark.jpg
    while using stock KiCad Button_Switch_Keyboard:SW_Cherry_MX_*_PCB footprints.
- question: Cherry MX footprint origin vs physical stem center alignment?
  choice: In stock KiCad Button_Switch_Keyboard:SW_Cherry_MX_*_PCB footprints (and rea_hardware.cad.keyswitch_model()),
    origin (0,0) is Pad 1 while the switch stem and 3D body center is at (-2.54, +5.08) mm in board coordinates
    (rot_deg=0). Therefore board.placement sets (x_mm, y_mm) = (x_stem + 2.54, y_stem - 5.08) so that
    the physical switch stem and 3D model center land exactly on each key's must_match feature center.
  reason: Ensures zero XY offset between the 3D switch stems on the PCBA and the keycaps/openings centered
    on fidelity.must_match.
- question: Power budget and regulator thermal margin?
  choice: 'VBUS_RAW (5.0 V from J1 with direct 5.1 kOhm 1% CC1/CC2 pull-downs R1/R2 C25905 to GND on F.Cu
    with 0 vias and local 100 nF 16V X7R high-frequency ESD decoupling capacitor C17 C1525 placed immediately
    adjacent to J1 ahead of F1) -> F1 (BSMD0805-050-24V 500 mA 24 V PTC resettable fuse, C910822, with
    R_cold = 0.15-0.85 Ohm providing overcurrent limiting, series hot-plug LC damping, and fault isolation
    for downstream shunt clamps) -> 5V_USB_KB (fused 5.0 V up to 0.5 A rail with USBLC6-2SC6 ESD array
    U4 pin 5 VBUS reference, fuse-coordinated PTVS5V0S1UR-FS 400 W unidirectional TVS diode D60 C5380694
    clamping overvoltage, reverse-polarity, and ESD transients downstream of F1 to <= 9.2 V, plus C1 =
    2.2 uF 25V X7R C19110 adjacent to U3) -> LDL1117S33R SOT-223-4 LDO (U3, C435835, V_IN operating up
    to 18 V / 20 V abs max >> 9.2 V ESD clamping transients, IQ = 250 uA typ / 500 uA max << 2.5 mA USB
    suspend limit, V_DO = 350 mV typ at 1.2 A / < 150 mV at 250 mA so even at 4.40 V min USB VBUS and
    0.25 A across post-trip F1 R_1max = 0.85 Ohm, V_IN = 4.188 V >> 3.55 V dropout threshold, and SOT-223-4
    R_thetaJA ~ 60 C/W supporting the full 0.25 A continuous 3V3_KB specification with T_J < 65 C) ->
    3V3_KB (C2 = 4.7 uF 25V X5R C1779 adjacent to U3). U3, C1, C2 sit in the monotonic power-entry path
    between J1/U4/F1/D60 and U2/U1, while C3/C4 sit immediately adjacent to U1 pins 44/45 on F.Cu with
    0 vias.'
  reason: Retains C17 (100 nF) at J1 on VBUS_RAW for high-frequency ESD decoupling while placing both
    D60 (PTVS5V0S1UR-FS) and U4.5 (USBLC6-2SC6 VBUS reference) downstream of PTC fuse F1 on 5V_USB_KB
    for fuse-coordinated overvoltage/reverse-polarity clamping alongside 20 V abs-max LDO U3 (LDL1117S33R).
- question: Firmware flashing mechanism?
  choice: Bottom-accessible tactile button SW59 (feature F_BOOTSEL, actuator A_BOOTSEL) pulling QSPI_SS_N
    low via 1 kOhm resistor R6 against 10 kOhm pull-up resistor R7 (C25744 to 3V3_KB) while plugging in
    rear USB-C port P_KB_DEV.
  reason: R7 keeps U2 ~{CS} pulled high to 3V3_KB during power-up/reset while SW59 + R6 divides QSPI_SS_N
    to 0.30 V (< V_IL) when held to enter the RP2040 ROM UF2 USB mass-storage bootloader over P_KB_DEV.
