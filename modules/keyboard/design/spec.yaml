enclosure:
  process: mjf
  wall_mm: 2.5
  clearance_floor_mm: 0.2
  parts:
  - id: bottom_shell
    file: case/out/bottom_shell.stl
    role: shell
    process: mjf
    material: PA12
    finish: matte warm-grey / beige
    color: '#d8d0c0'
    description: 'Stepped wedge lower chassis pan (X: -14..324, Y: -146..2, Z: -14..0+walls) with 6 PCB
      mounting bosses, rear USB-C port cutout, and bottom BOOTSEL button aperture'
  - id: bootsel_button
    file: case/out/bootsel_button.stl
    role: button
    process: mjf
    material: PA12
    finish: matte dark grey
    color: '#5a5852'
    description: Captive bottom-accessible push button actuator cap at world XY=(155.0, -18.0) aligned
      under SW59 for RP2040 BOOTSEL mode
  - id: top_shell
    file: case/out/top_shell.stl
    role: shell
    process: mjf
    material: PA12
    finish: matte warm-grey / beige
    color: '#e5dec9'
    description: Classic stepped beige upper bezel framing the 5-row 58-key well with raised rear ledge
      reaching Z=34.0 mm
  - id: keycaps
    file: case/out/keycaps.stl
    role: button
    process: mjf
    material: PA12
    finish: matte warm-beige sculpted keycaps
    color: '#cbc2b0'
    decor: case/out/keycaps_legends.stl
    decor_color: '#2b2927'
    description: 58 sculpted mechanical keycaps generated with rea_hardware.cad.keycap(width_u, legend)
      seated on the 58 switch stems at Z=6.6 mm with contrasting dark legends
assembly:
- part: bottom_shell
  travel_mm: 0
  held_by: base
  note: Base lower chassis resting on desk (Z=-14.0 mm floor)
- part: bootsel_button
  direction:
  - 0
  - 0
  - -1
  travel_mm: 20
  may_touch:
  - bottom_shell
  held_by: captured
  note: Flanged BOOTSEL button cap dropped into bottom shell aperture from inside before PCB installation
- part: pcba
  direction:
  - 0
  - 0
  - -1
  travel_mm: 30
  may_touch:
  - bottom_shell
  - bootsel_button
  held_by: captured
  note: Main 310x132 mm keyboard PCBA lowered onto bottom shell standoffs (Z=0..1.6 mm) with rear USB-C
    J1 aligned to P_KB_DEV opening
- part: top_shell
  direction:
  - 0
  - 0
  - -1
  travel_mm: 35
  may_touch:
  - bottom_shell
  - pcba
  held_by: snap
  held_with:
  - bottom_shell
  note: Stepped beige top bezel lowered over switch cluster and snapped onto bottom shell perimeter
- part: keycaps
  direction:
  - 0
  - 0
  - -1
  travel_mm: 35
  may_touch:
  - pcba
  held_by: press_fit
  held_with:
  - pcba
  note: 58 sculpted keycaps pressed straight down (-Z) onto the 58 Cherry MX switch stems at Z=6.6 mm
