decisions:
  - question: "Which 2D optical navigation sensor, optical relay, and supply configuration?"
    choice: "PixArt PMW3901MB-TXQT (LCSC C43496881) paired with a thick plano-convex aspheric SLA macro collimator lens window (sensor_window: n = 1.51, R1 = infinity, R2 = -3.060 mm, t_c = 4.530 mm, EFL f = 6.000 mm / +166.7 D, front principal plane shift delta_1 = t_c/n = 3.000 mm, Front Focal Distance FFD = 3.000 mm, focus window d_desk in [2.581 mm, 3.486 mm] = +/-0.453 mm) and direct SLA mechanical datum stops against U2's COB-28 bottom face, supplied by 3.3 V VDDIO (from U3 ME6209A33M3G) and 2.0 V VDD (from U4 XC6206P202MR-G on 2V0_SENSOR) with 10k pull-down R5 on SENSOR_NRESET"
    reason: "PMW3901MB-TXQT is the only optical navigation sensor in stock on LCSC (165 pcs); using a thick plano-convex aspheric collimator (R1 = infinity, R2 = -3.060 mm, t_c = 4.530 mm, n = 1.51) yields exact thick-lens EFL f = 6.000 mm and FFD = 3.000 mm (delta_1 = 3.000 mm), expanding the |s_i| >= 80 mm focus tolerance window by 4.1x to +/-0.453 mm (0.905 mm total, d_desk in [2.581 mm, 3.486 mm]) while direct SLA datum stops against U2's COB-28 package (+/-0.05 mm SLA accuracy) isolate the optical path from FDM shell stack-up tolerances."
  - question: "Power budget across USB_VBUS, 5V_USB_MOUSE, 3V3_MOUSE, and 2V0_SENSOR in active and USB 2.0 suspend modes?"
    choice: "Active: 51.1 mA nominal / <= 80 mA continuous max / 150 mA rail capability (18 mA U1 STM32F042K6T6 + 15 mA U2 VDD on 2V0_SENSOR + 5 mA U2 VDDIO on 3V3_MOUSE + 12.73 mA D2/D3 illumination LEDs + 0.33 mA R5/R13 pull-downs) through F1 (BSMD0603-025-24V, I_hold = 250 mA @ 25 C / 190 mA >= 150 mA @ 50 C, R_1max = 3.0 Ohm), Q2 (AO3401A P-MOSFET reverse-polarity switch, R_DS(on) <= 60 mOhm, Gate clamped by 8.2V Zener D6 + 10k R15), U3 ME6209A33M3G (250 mA rated, 3 uA Iq, >= +0.437 V dropout headroom even at 150 mA and post-reflow R_1max = 3.0 Ohm) and U4 XC6206P202MR-G (120 mA rated, 1 uA Iq); USB 2.0 Suspend & DFU Suspend: ~0.24 mA (<= 2.5 mA limit) with D2/D3 shut off via N-MOSFET Q1 (AO3400A, R13 pull-down) and U2 held in reset via R5 (10k pull-down on SENSOR_NRESET)"
    reason: "Series P-MOSFET Q2 (AO3401A) ahead of VBUS_PROT blocks reverse polarity completely (0.00 V on D1 and U3) so D1 (USBLC6-2SC6) serves strictly as an 8/20 us transient ESD clamp rather than a DC crowbar; 250 mA PPTC fuse F1 (BSMD0603-025-24V, I_hold(50 C) = 190 mA >= 150 mA, R_1max = 3.0 Ohm) keeps series voltage drop <0.50 V at 100-150 mA; and pulling both OPT_LED_EN (R13) and SENSOR_NRESET (R5) to GND ensures <0.25 mA suspend current during reset, DFU bootloader, and USB suspend."
  - question: "MCU and firmware flashing mechanism?"
    choice: "STM32F042K6T6 (LCSC C69216) using factory System Memory USB DFU bootloader triggered by bottom BOOT0 button SW2 with hardware RC debounce C14 (100 nF on MCU_BOOT0, 1.0 ms hold time across bounce gaps; live firmware polling on PB8 debounces >= 20 ms before triggering NVIC_SystemReset() into DFU; cold-boot hardware recovery holds SW2 during USB-C insertion)"
    reason: "STM32F042K6T6 includes crystal-less USB 2.0 FS with HSI48 + Clock Recovery System (CRS) and native ROM USB DFU bootloader on PA11/PA12 when BOOT0 is latched high on the 4th rising edge of SYSCLK after POR (held stable across contact bounce by C14 = 100 nF with R3 = 10k and R8 = 1k)."
