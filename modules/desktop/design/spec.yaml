fab:
  profile: jlcpcb
  layers: 4
  thickness_mm: 1.6
  assembly_sides: [top, bottom]
electrical:
  mcu: "Raspberry Pi Compute Module 5 (U_CM5, rea_refs:ComputeModule5-CM5 on dual DF40C-100DS-0.4V(51) sockets, LCSC C597931)"
  power: "External 65 W USB-C PD adapter into J_PWR (VBUS_IN decoupled by 1 uF 50 V C_PD_IN C91185, cSnkVBus <= 2.0 uF << 10 uF USB Type-C limit) -> WCH CH224A standalone resistor-strapped PD sink (LCSC C42459160, R_PD_CFG1=56k C114756 requesting 15 V, R_PD_VHV=1k C11702 RC filter feeding VHV + 1 uF C_PD_VHV) -> PG-controlled AO3407A 30 V P-FET high-side load switch (Q_PD_SW, LCSC C347478, soft-started by R_PD_PG=100k, R_PD_PG2=100k, and C_PD_SS=100nF, isolating 67.1 uF C_PD_BULK + C_VIN1..3 on VBUS_PD until 15 V PD negotiation completes) -> Silergy SY8205FCC 4.5-30 V input (33 V abs max), 5 V / 5 A synchronous buck (U_BUCK, LCSC C111875, 5V_SYS) -> CM5 +5v_(Input) pins 77/79/81/83/85/87 (with PSU_MAX_CURRENT=5000 in EEPROM); CM5 internal PMIC supplies 3V3_CM5 (pins 84/86) tied directly to GPIO_VREF (pin 78) and carrier pull-ups, while TI TLV62569DBVR 3.3 V / 2 A synchronous buck (U_3V3, LCSC C141836, enabled by 3V3_CM5) supplies 3V3_SYS from 5V_SYS to front_io (J_FIO.1-2) and LCD panel load switch U_SW_DSI (TPS2051BDBVR, LCSC C24593, 3V3_DSI on J_DSI.22)"
  blocks:
    - id: pd_sink_buck
      purpose: "Standalone resistor-strapped WCH CH224A USB-C PD sink (R_PD_CFG1=56k C114756, R_PD_VHV=1k C11702) negotiating 15 V on P_PWR (VBUS_IN with C_PD_IN=1uF <= 10uF cSnkVBus limit) and gating AO3407A P-FET load switch Q_PD_SW (C347478) via PG to isolate 67.1 uF bulk capacitance (C_PD_BULK, C_VIN1..3) on VBUS_PD feeding Silergy SY8205FCC 4.5-30 V input (33 V abs max), 5 V / 5 A synchronous buck converter (U_BUCK) supplying 5V_SYS, plus TI TLV62569DBVR 3.3 V / 2 A synchronous buck converter (U_3V3, enabled by 3V3_CM5) supplying 3V3_SYS to front_io and U_SW_DSI"
      key_parts: [TYPE-C-31-D-06, CH224A, AO3407A, SY8205FCC, TLV62569DBVR]
      reference: "WCH CH224 datasheet application circuit (CFG1 56 kOhm resistor strapping for 15 V PD), Silergy SY8205FCC 30V 5A synchronous buck application circuit, and TI TLV62569DBVR 3.3V 2A buck application circuit"
    - id: cm5_core
      purpose: "Raspberry Pi Compute Module 5 dual 100-pin mezzanine interface feeding all six +5v_(Input) pins (77,79,81,83,85,87), tying +3.3v_(Output) (pins 84,86) directly to GPIO_VREF (pin 78), and routing PWR_BUT (pin 92) to SW_PWR"
      key_parts: [DF40C-100DS-0.4V, PTS526SM15SMTR2LFS]
      reference: "Raspberry Pi Compute Module 5 IO Board rev 2 KiCad reference design (pip.raspberrypi.com)"
    - id: usb_boot_and_host
      purpose: "Direct service USB-C 2.0 OTG port P_BOOT wired straight to CM5 USB2_P/N (pins 105/103) with nRPIBOOT button SW_BOOT (pin 93) and USB_OTG_ID (pin 101) bootstrap; RP1 USB3-0-D_P/N (pins 134/136) and USB3-1-D_P/N (pins 163/165) routed to rear USB-C host ports P_KB and P_MOUSE with TI TUSB320LIRWBR DFP CC controllers (U_CC_KB, U_CC_MOUSE) gating TPS2041BDBVR VBUS switches (U_SW_KB, U_SW_MOUSE) with 10 kOhm VBUS output discharge bleeders (R_KB_DIS, R_MOUSE_DIS, t_vSafe0V = 183 ms < 650 ms)"
      key_parts: [TYPE-C-31-D-06, PTS526SM15SMTR2LFS, TUSB320LIRWBR, TPS2041BDBVR]
      reference: "Raspberry Pi CM5 Datasheet Section 3.4 (USB OTG boot and RP1 USB host routing) and TI TUSB320LI / TPS2041B datasheets"
    - id: display_mipi_backlight
      purpose: "22-pin 0.5 mm FFC connector J_DSI carrying 4-lane MIPI1 DSI + I2C + switched 3V3_DSI (via TPS2051BDBVR load switch U_SW_DSI from 3V3_SYS) to the native 3.3 V 8.0-inch 4:3 IPS MIPI-DSI panel (KD080D10-22MIPI-A1) over a 100-Ohm shielded FFC, plus TI TPS61165DBVR constant-current LED backlight boost driver dimmed by CM5 GPIO18 PWM via 4-pin JST-PH harness J_BL"
      key_parts: [FH12-22S-0.5SH, TPS2051BDBVR, TPS61165DBVR, B4B-PH-SM4-TB]
      reference: "Raspberry Pi CM5 IO Board MIPI DSI port 1 pinout and TI TPS61165 datasheet WLED boost driver"
    - id: hdmi_out
      purpose: "Rear full-size HDMI-A receptacle J_HDMI connected to CM5 HDMI0 TMDS differential pairs, direct CM5-conditioned DDC I2C / CEC / hotplug detect with TPD4E05U06DQAR ESD protection, and AP2331SA-7 current-limited reverse-blocking +5V_HDMI switch U_SW_HDMI"
      key_parts: [HYC79-HDMIA19-105, AP2331SA-7, TPD4E05U06DQAR]
      reference: "Raspberry Pi CM5 IO Board rev 2 HDMI0 output circuit"
    - id: front_io_subboard
      purpose: "2-layer front I/O sub-board connected via 22-pin 0.5 mm FFC cable (J_FIO to J_SUB_FIO, powered by carrier 3V3_SYS on pins 1-2), carrying push-push SD card socket J_SD (CM5 SDIO interface) and brightness rotary encoder wheel SW_ENC (CM5 GPIO quadrature + pushbutton)"
      key_parts: [FH12-22S-0.5SH, SD-106M, EC11J1525402]
      reference: "Raspberry Pi CM5 IO Board SD card interface and Alps EC11 quadrature encoder circuit"
  nets_must_connect:
    - ["J_PWR.CC1", "U_PD.CC1"]
    - ["J_PWR.CC2", "U_PD.CC2"]
    - ["Q_PD_SW.S", "J_PWR.VBUS"]
    - ["U_BUCK.VIN", "Q_PD_SW.D"]
    - ["U_CM5.+5v_(Input)", "5V_SYS"]
    - ["U_CM5.GPIO_VREF(1.8v/3.3v_Input)", "U_CM5.+3.3v_(Output)"]
    - ["J_BOOT.DP1", "U_CM5.USB2_P"]
    - ["J_BOOT.DN1", "U_CM5.USB2_N"]
    - ["SW_BOOT.1", "U_CM5.nRPIBOOT"]
    - ["SW_PWR.1", "U_CM5.PWR_BUT"]
    - ["J_KB.DP1", "U_CM5.USB3-0-D_P"]
    - ["J_KB.DN1", "U_CM5.USB3-0-D_N"]
    - ["J_MOUSE.DP1", "U_CM5.USB3-1-D_P"]
    - ["J_MOUSE.DN1", "U_CM5.USB3-1-D_N"]
    - ["U_BL.CTRL", "U_CM5.GPIO18"]
  high_speed:
    - name: mipi_dsi1
      board: main
      kind: diff_pairs
      nets: ["MIPI1_D0_*", "MIPI1_D1_*", "MIPI1_D2_*", "MIPI1_D3_*", "MIPI1_C_*"]
      tolerance_mm: 1.0
      diff_impedance_ohm: 100.0
      source: "Raspberry Pi Compute Module 5 Datasheet Section 3.7 MIPI DSI (100 ohm differential, intra-pair skew <= 1.0 mm)"
    - name: hdmi0_tmds
      board: main
      kind: diff_pairs
      nets: ["HDMI0_TX0_*", "HDMI0_TX1_*", "HDMI0_TX2_*", "HDMI0_CLK_*"]
      tolerance_mm: 1.0
      diff_impedance_ohm: 100.0
      source: "Raspberry Pi Compute Module 5 Datasheet Section 3.6 HDMI (100 ohm differential)"
    - name: usb2_otg_boot
      board: main
      kind: diff_pairs
      nets: ["USB2_P", "USB2_N"]
      tolerance_mm: 1.5
      diff_impedance_ohm: 90.0
      source: "Raspberry Pi Compute Module 5 Datasheet Section 3.4 USB 2.0 (90 ohm differential)"
    - name: usb_host_kb
      board: main
      kind: diff_pairs
      nets: ["USB3-0-D_P", "USB3-0-D_N"]
      tolerance_mm: 1.5
      diff_impedance_ohm: 90.0
      source: "Raspberry Pi Compute Module 5 Datasheet Section 3.5 RP1 USB 2.0 Host (90 ohm differential)"
    - name: usb_host_mouse
      board: main
      kind: diff_pairs
      nets: ["USB3-1-D_P", "USB3-1-D_N"]
      tolerance_mm: 1.5
      diff_impedance_ohm: 90.0
      source: "Raspberry Pi Compute Module 5 Datasheet Section 3.5 RP1 USB 2.0 Host (90 ohm differential)"
board:
  width_mm: 180.0
  height_mm: 245.0
  corner_radius_mm: 4.0
  mounting_holes:
