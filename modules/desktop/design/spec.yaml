    name: Front SD card and brightness encoder sub-board
    layers: 2
    width_mm: 150.0
    height_mm: 65.0
    corner_radius_mm: 3.0
    world_position_mm: [0.0, -197.0, 331.5]
    world_rotation_deg: [0.0, 0.0, 0.0]
    mounting_holes:
      - {x_mm: 5.0, y_mm: 5.0, drill_mm: 2.5}
      - {x_mm: 145.0, y_mm: 5.0, drill_mm: 2.5}
      - {x_mm: 5.0, y_mm: 60.0, drill_mm: 2.5}
      - {x_mm: 145.0, y_mm: 60.0, drill_mm: 2.5}
    placement:
      - {ref: J_SD, role: sd_card_slot, side: top, x_mm: 118.5, y_mm: 19.0, rot_deg: 180, feature: F_SD, tolerance_mm: 1.5, mates_source: "SD-106M at y=19.0, rot_deg=180: card mouth sits at top edge y=0.32 facing -Y/+Z aligned with front horizontal media slot"}
      - {ref: SW_ENC, role: brightness_encoder, side: bottom, x_mm: 14.5, y_mm: 51.0, rot_deg: 0, feature: F_BRIGHT, tolerance_mm: 1.5, mates_source: "EC11J1525402 SMD rotary encoder on bottom side: shaft points along -Z into brightness_wheel under lower-left chin overhang"}
