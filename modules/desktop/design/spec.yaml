  - {refs: [J_PWR, J_KB, J_MOUSE, J_BOOT], role: usb_c_receptacle, mpn: TYPE-C-31-D-06, lcsc: C2689964, footprint: "lcsc:USB-C-SMD_TYPE-C-31-D-06", description: "Vertical 16-pin USB-C receptacle for PD input, USB host, and OTG boot"}
  - {refs: [J_HDMI], role: hdmi_receptacle, mpn: HYC79-HDMIA19-105, lcsc: C711353, footprint: "lcsc:HDMI-SMD_HYC79-HDMIA19-105", description: "Vertical 19-pin HDMI-A receptacle"}
