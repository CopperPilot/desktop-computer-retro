    - {x_mm: 174.0, y_mm: 6.0, drill_mm: 3.2}
    - {x_mm: 6.0, y_mm: 239.0, drill_mm: 3.2}
    - {x_mm: 174.0, y_mm: 239.0, drill_mm: 3.2}
  placement:
    - {ref: U_CM5, role: mcu_module_socket, side: top, x_mm: 66.0, y_mm: 123.5, rot_deg: 270, tolerance_mm: 2.0}
    - {ref: J_PWR, role: usb_c_pd_in, side: bottom, x_mm: 156.0, y_mm: 225.0, rot_deg: 0, feature: P_PWR, tolerance_mm: 1.5, mates_source: "Vertical USB-C receptacle TYPE-C-31-D-06 on bottom side: mouth faces -Z (rear panel opening)"}
    - {ref: J_KB, role: usb_c_kb_host, side: bottom, x_mm: 128.0, y_mm: 225.0, rot_deg: 0, feature: P_KB, tolerance_mm: 1.5, mates_source: "Vertical USB-C receptacle TYPE-C-31-D-06 on bottom side: mouth faces -Z (rear panel opening)"}
    - {ref: J_MOUSE, role: usb_c_mouse_host, side: bottom, x_mm: 100.0, y_mm: 225.0, rot_deg: 0, feature: P_MOUSE, tolerance_mm: 1.5, mates_source: "Vertical USB-C receptacle TYPE-C-31-D-06 on bottom side: mouth faces -Z (rear panel opening)"}
    - {ref: J_BOOT, role: usb_c_otg_boot, side: bottom, x_mm: 72.0, y_mm: 225.0, rot_deg: 0, feature: P_BOOT, tolerance_mm: 1.5, mates_source: "Vertical USB-C receptacle TYPE-C-31-D-06 on bottom side: mouth faces -Z (rear panel opening)"}
    - {ref: SW_BOOT, role: rpiboot_button, side: bottom, x_mm: 52.0, y_mm: 225.0, rot_deg: 0, feature: F_BOOT_BTN, tolerance_mm: 1.5, mates_source: "Top-actuated tactile switch PTS526 on bottom side: button faces -Z (pressed along +Z from rear)"}
    - {ref: J_HDMI, role: hdmi_out, side: bottom, x_mm: 32.0, y_mm: 225.0, rot_deg: 0, feature: P_HDMI, tolerance_mm: 1.5, mates_source: "Vertical HDMI-A receptacle HYC79-HDMIA19-105 on bottom side: mouth faces -Z (rear panel opening)"}
    - {ref: SW_PWR, role: power_button, side: bottom, x_mm: 12.0, y_mm: 225.0, rot_deg: 0, feature: F_PWR_BTN, tolerance_mm: 1.5, mates_source: "Top-actuated tactile switch PTS526 on bottom side: button faces -Z (pressed along +Z from rear)"}
    - {ref: J_DSI, role: mipi_dsi_ffc, side: top, x_mm: 60.0, y_mm: 2.5, rot_deg: 180, tolerance_mm: 2.0, mates_source: "FH12-22S-0.5SH at top edge (y=2.5, rot_deg=180): FFC mouth faces -Y (upward over top board edge toward display)"}
    - {ref: J_BL, role: backlight_header, side: top, x_mm: 95.0, y_mm: 2.5, rot_deg: 0, tolerance_mm: 2.0, mates_source: "B4B-PH-SM4-TB vertical 4-pin JST-PH header on top side: mouth faces +Z toward display backlight harness"}
    - {ref: J_FIO, role: front_io_ffc, side: top, x_mm: 130.0, y_mm: 242.5, rot_deg: 0, tolerance_mm: 2.0, mates_source: "FH12-22S-0.5SH at bottom edge (y=242.5, rot_deg=0): FFC mouth faces +Y (downward over bottom board edge toward front_io sub-board)"}
  max_component_height_mm:
    top: 10.0
    bottom: 12.0
sub_boards:
