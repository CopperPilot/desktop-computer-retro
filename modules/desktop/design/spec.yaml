  name: Compact all-in-one CM5 desktop computer
  summary: "1984-style compact vertical all-in-one desktop computer with 8.0-inch 4:3 IPS MIPI-DSI LCD, Raspberry Pi CM5 carrier board, autonomous 15 V USB-PD power input, USB-C host/service ports, HDMI output, and front SD/brightness sub-board"
  category: desktop computer
inputs:
  images:
    - inputs/front.jpg
    - inputs/three_quarter_dark.jpg
    - inputs/three_quarter_light.jpg
  views:
    front: inputs/front.jpg
  prompt: inputs/prompt.md
view:
  up: [0, 1, 0]
  front: [0, 0, 1]
envelope:
  width_mm: 247.0
  height_mm: 300.0
  depth_mm: 346.0
  corner_radius_mm: 8.0
  derivation: "Published 1984 compact all-in-one desktop enclosure envelope 247.0 x 300.0 x 346.0 mm (9.72 x 11.81 x 13.62 in) per system module contract and front.jpg scaling (247.0 mm width)"
  front_origin_world_mm: [-33.5, 20.0, 336.5]
fidelity:
