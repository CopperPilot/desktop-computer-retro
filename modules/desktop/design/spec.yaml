decisions:
  - question: "Which LCSC part number is used for the standalone resistor-strapped CH224K USB-PD sink controller?"
    choice: "WCH CH224A (LCSC C42459160, ESSOP-10) with R_PD_CFG1 = 56 kOhm 1% resistor (RC0402FR-0756KL, LCSC C114756) from CFG1 (pin 9) to GND for 15 V USB-PD 3.0 fixed PDO negotiation and R_PD_VHV = 1 kOhm resistor (0402WGF1001TCE, C11702) between VBUS_IN (pin 8) and VHV (pin 1) with 1 uF 50 V X5R bypass C_PD_VHV (C15849) per the CH224A application circuit, keeping unswitched J_PWR VBUS_IN capacitance to C_PD_IN = 1 uF 50 V X7R (CC0805KKX7R9BB105, C91185) ahead of PG-controlled AO3407A P-FET load switch Q_PD_SW (C347478)"
    reason: "CH224K (C970725) has only 4 units in stock at JLCPCB (<10 minimum), whereas CH224A (C42459160) is the pin-compatible ESSOP-10 WCH CH224 family variant with >9,000 units in stock whose CFG1 single-resistor strapping table specifies 56 kOhm to GND for 15 V PD request (drawing 1.85 A peak at 27.71 W input, well within the 3.0 A PDO limit) and whose internal HV LDO input pin 1 (VHV, 3.0-30 V) is fed from VBUS_IN through a 1 kOhm RC isolation resistor (R_PD_VHV = 1 kOhm, C11702) with a 1 uF bypass capacitor (C_PD_VHV, C15849)."
  - question: "Power path voltage ratings and current budget across all rails?"
    choice: "15 V / 3 A VBUS_PD (45 W, clamped by Nexperia PTVS15VS1UR,115 15 V standoff TVS D_PD_VBUS, C513104, V_BR=16.7-18.5 V, V_CL=24.4 V at I_PP=16.4 A, and damped against USB-C hot-plug LC overshoot by a 47 uF 35 V 150 mOhm Case-D tantalum bulk capacitor C_PD_BULK, CA55-D035K476TE150, C2761441, alongside 2x 10 uF 35 V X5R C_VIN1/C_VIN2 and 100 nF C_VIN3) -> Silergy SY8205FCC (U_BUCK, C111875, 4.5-30 V recommended operating input, 33 V abs max input, 5 V / 5.0 A continuous / 6.0 A peak output with R_BUCK_FB1=73.2k, C26986, and R_BUCK_FB2=10k, C25744, setting V_OUT=4.992 V, EN driven to 2.50 V nominal / >=2.38 V worst-case at 14.25 V > 1.2 V V_ENH via R_BUCK_EN1=100k, C25741, and R_BUCK_EN2=20k, C25765, with C_BUCK_EN=100nF C307331 delaying buck startup by tau_EN=1.67 ms after CH224A active-low open-drain PG pin 10 turns on AO3407A P-FET load switch Q_PD_SW, C347478, via R_PD_PG=100k, R_PD_PG2=100k, and C_PD_SS=100nF (V_GS=-7.50 V at 15 V, tau_G=5.0 ms soft-start isolating the 67.1 uF C_PD_BULK + C_VIN1..3 capacitance from J_PWR VBUS_IN C_PD_IN=1uF until PD negotiation completes), with 3x 47 uF 10 V X5R 0805 output capacitors C_5V1-C_5V3, C76636, 141 uF nominal / ~70 uF effective at 5 V plus 100 nF C_5V4 adjacent to L_BUCK.2 and U_BUCK GND pad 9) -> 5V_SYS (buffered at U_CM5 +5v_(Input) pins 77-87 by a 100 uF 10 V 15 mOhm solid polymer bulk capacitor C_CM5_BULK, SA11AM101A19R15XXX, C135491, and 100 nF C_CM5_5V with PSU_MAX_CURRENT=5000 configured in CM5 EEPROM, feeding 3.0 A CM5 peak + 0.5 A P_KB + 0.5 A P_MOUSE + 0.48 A TPS61165 backlight boost + 0.35 A TLV62569 3V3_SYS buck + 0.055 A J_HDMI = 4.885 A max < 5.0 A limit, with 5V_USB_KB and 5V_USB_MOUSE switched by TPS2041BDBVR load switches U_SW_KB/U_SW_MOUSE driven by TI TUSB320LIRWBR DFP CC controllers U_CC_KB/U_CC_MOUSE with 10 kOhm VBUS output discharge bleeders R_KB_DIS/R_MOUSE_DIS (C25744, t_vSafe0V=183.3 ms < 650 ms) and 5V_HDMI switched by an AP2331SA-7 current-limited <=0.4 A reverse-blocking high-side load switch U_SW_HDMI, C500764); TI TLV62569DBVR (U_3V3, C141836, 5V->3.3V 2.0 A synchronous buck enabled by 3V3_CM5, equipped with active output discharge Q_3V3_INV/Q_3V3_DIS BSS138 C78284 + R_3V3_DIS=33R C25105 + R_3V3_DIS_PU=10k C25744 to 5V_SYS + 1k bleeder R_3V3_BLEED C11702 and B5819W Schottky sequencing clamp D_3V3_CLAMP C2943878 from 3V3_SYS Anode to 3V3_CM5 Cathode) supplies 3V3_SYS to front_io (J_FIO.1-2) and TPS2051BDBVR load switch U_SW_DSI (C24593, gating 3V3_DSI on J_DSI.22 via DSI1_EN with 1k discharge R_DSI_DIS C11702 and 1.8k SCL0/SDA0 pull-ups R_DSI_SCL/R_DSI_SDA referenced to switched 3V3_DSI), keeping CM5 internal PMIC 3V3_CM5 (rated <= 600 mA max external load per Raspberry Pi CM5 Datasheet Section 2.1) dedicated to GPIO_VREF (pin 78) and low-current carrier pull-ups (<20 mA, 10.2 uF decoupling)."
    reason: "Replacing U_BUCK with SY8205FCC (4.5-30 V recommended operating input, 33 V abs max) ensures that both the 18.5 V max breakdown and 24.4 V at 16.4 A clamping voltage of D_PD_VBUS (PTVS15VS1UR,115) remain well below U_BUCK's 30 V operating limit and 33 V destruction threshold; setting R_PD_PG2=100k guarantees V_GS >= 2.38 V on Q_BUCK_EN during 5 V USB-PD pre-negotiation so U_BUCK cannot start prematurely; offloading front_io and J_DSI.22 onto the dedicated 2 A TLV62569DBVR 3V3_SYS buck regulator (with active output discharge Q_3V3_INV/Q_3V3_DIS + R_3V3_DIS=33R + R_3V3_BLEED=1k and B5819W Schottky clamp D_3V3_CLAMP so 3V3_SYS never exceeds 3V3_CM5 during shutdown/reset, and gating J_DSI.22 with TPS2051BDBVR U_SW_DSI + R_DSI_DIS=1k with R_DSI_SCL/R_DSI_SDA referenced to switched 3V3_DSI) keeps CM5 +3.3v_(Output) load (<20 mA) and capacitance (10.2 uF) far below the 600 mA CM5 PMIC limit while eliminating GPIO back-drive."
