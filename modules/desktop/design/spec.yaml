    - {name: overall_height, kind: overall_height, value_mm: 300.0, tol_mm: 2.0, source: "Module contract envelope 247.0 x 300.0 x 346.0 mm"}
    - {name: overall_depth, kind: overall_depth, value_mm: 346.0, tol_mm: 2.0, source: "Module contract envelope 247.0 x 300.0 x 346.0 mm"}
    - {name: bezel, kind: bezel, value_mm: 42.2, tol_mm: 5.0, source: "Measured from inputs/front.jpg: (247.0 - 162.6)/2 = 42.2 mm side bezel around 8.0-inch 4:3 screen"}
