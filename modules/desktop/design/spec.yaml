cables:
  - id: mipi_dsi_cable
    kind: ffc
    a: {part: pcba, connector: J_DSI}
    b: {part: lcd_panel, connector: dsi_in}
    pins: 22
    pitch_mm: 0.5
    length_mm: 375.0
    width_mm: 11.5
    route:
      - {at_mm: [60.0, -2.5, 3.0]}
      - {at_mm: [60.0, 5.0, 10.0]}
      - {at_mm: [60.0, -79.0, 164.0]}
      - {at_mm: [60.0, -156.0, 326.75]}
    note: "100-Ohm impedance-controlled, double-shielded silver-ink EMI-shielded 22-pin 0.5mm pitch MIPI DSI FFC (G-S-S-G coplanar ground-shielded pinout with GND on pins 1, 4, 7, 10, 13, 16, 19) connecting carrier J_DSI to the 8.0-inch native 3.3V MIPI-DSI LCD panel (KD080D10-22MIPI-A1); operating at 1024x768 @ 60 Hz across all 4 MIPI DSI lanes reduces per-lane data rate to 283 Mbps/lane (141.5 MHz Nyquist clock), where 375 mm shielded 100-Ohm FFC insertion loss is < 1.2 dB (well within the > 6 dB MIPI D-PHY v1.2 HS receiver eye budget)"
  - id: backlight_cable
    kind: harness
    a: {part: pcba, connector: J_BL}
    b: {part: lcd_panel, connector: bl_in}
    pins: 4
    pitch_mm: 2.0
    length_mm: 375.0
    route:
      - {at_mm: [95.0, -2.5, 8.0]}
      - {at_mm: [95.0, 5.0, 14.0]}
      - {at_mm: [95.0, -79.0, 164.0]}
      - {at_mm: [95.0, -156.0, 326.75]}
    note: "4-wire JST-PH LED backlight anode/cathode harness (BL_LED_A on pin 1, BL_FB on pin 2, GND on pins 3-4) from TPS61165 driver to LCD panel, with BL_PWM kept local to U_BL.CTRL on the carrier PCB"
  - id: front_io_cable
    kind: ffc
    a: {part: pcba, connector: J_FIO}
    b: {part: "pcba:front_io", connector: J_SUB_FIO}
    pins: 22
    pitch_mm: 0.5
    length_mm: 360.0
    width_mm: 11.5
    route:
      - {at_mm: [130.0, -242.5, 3.0]}
      - {at_mm: [100.0, -255.0, 160.0]}
      - {at_mm: [75.0, -259.5, 330.0]}
    note: "Type-B (opposite-side contact, 1-to-1 pinout) 22-pin 0.5mm pitch FFC connecting top-mounted carrier J_FIO (F.Cu, rot=0) to bottom-mounted J_SUB_FIO (B.Cu, rot=0, mirrored local X pad coordinates with Pin 1 at +X=80.25mm and Pin 22 at -X=69.75mm), carrying CM5 RP1 GPIO Bank 0 secondary SDIO constrained to <= 12.5 MHz Default-Speed mode (80 ns period via CM5 RP1 mmc DT overlay max-frequency = <12500000> to accommodate the ~68-75 pF distributed passive link capacitance and 6.8-7.0 ns round-trip propagation delay across 597 mm with 33R host-side source termination at U_CM5 and 22R card-side series damping/ESD-isolation resistors R40, R12, R14, R15, R37, R38 on CLK, CMD, and DAT0..3 between U7.B1..B6 and U2/U3/J_SD) with G-S-S-G-S-S-G-S-G ground return interleaving across pins 5-13 (1-2=3V3_SYS supplied by carrier U_3V3 TLV62569DBVR 3.3V 2A buck with active discharge Q_3V3_INV/Q_3V3_DIS + R_3V3_DIS=33R + R_3V3_BLEED=1k and B5819W Schottky clamp D_3V3_CLAMP to 3V3_CM5 feeding front_io local 3.3V rail /3V3_CM5, 3=GND, 4=SD_CLK_GPIO22 via R_SD_CLK 33R, 5=GND, 6=SD_CMD_GPIO23 via R_SD_CMD 33R + 100k R_SD_CMD_PU, 7=SD_DAT0_GPIO24 via R_SD_DAT0 33R + 100k R_SD_DAT0_PU, 8=SDIO_RET tied to GND via parallel 0R R28/R36, 9=SD_DAT1_GPIO25 via R_SD_DAT1 33R + 100k R_SD_DAT1_PU, 10=SD_DAT2_GPIO26 via R_SD_DAT2 33R + 100k R_SD_DAT2_PU, 11=GND, 12=SD_DAT3_GPIO27 via R_SD_DAT3 33R + 100k R_SD_DAT3_PU, 13=SDIO_RET tied to GND via parallel 0R R28/R36, 14=SD_PWR_ON with 100k carrier pull-down R_SD_PWR_PD and 10k sub-board pull-down R8 + 100pF C15 C0G HF filter, 15=GND, 16-18=33R source-terminated Schmitt-trigger-buffered encoder outputs ENC_A/ENC_B/ENC_SW from U5, 19=SD_FAULT_VSS_N from U1.4 ~{FAULT} with 10k pull-up R21 driving upstream fault-reset Schottky diode D5 on /SD_PWR_DLY and fast fault-clamp Schottky diode D6 on /SD_OE_GATE, 20-21=33R source-terminated Schmitt-trigger-buffered SD switch outputs SD_CD_VSS_GPIO6/SD_WP_VSS_GPIO13 from U8 via R16/R17, 22=GND) to front_io sub-board"
requirements:
  - id: R1
    text: "1984-style compact vertical all-in-one desktop computer enclosure (247x300x346 mm) with recessed 4:3 screen bezel, front media slot, and chin overhang"
    how_met: "Sculpted two-piece ABS enclosure (247.0 x 300.0 x 346.0 mm) with recessed 8.0-inch 4:3 window, horizontal SD slot opening, and lower-left brightness dial"
    quantity: "247.0 x 300.0 x 346.0 mm"
  - id: R2
    text: "8.0-inch 4:3 IPS LCD display driven by Raspberry Pi Compute Module 5 via MIPI DSI with dedicated LED backlight driver and PWM dimming harness"
    how_met: "Purchased native 3.3 V single-supply 22-pin 4-lane MIPI-DSI 8.0-inch 1024x768 4:3 IPS LCM (KD080D10-22MIPI-A1, featuring integrated Fitipower EK79007 / Ilitek ILI9881C MIPI-DSI T-CON and internal charge-pump AVDD/VGH/VGL bias generation from 3.3 V /3V3_DSI on pin 22) connected to J_DSI (4-lane MIPI1 over a 100-Ohm impedance-controlled double-shielded 22-pin 0.5 mm FFC at 283 Mbps/lane / 141.5 MHz Nyquist clock across 4 lanes, with J_DSI.22 3V3_DSI supplied from 3V3_SYS via TPS2051BDBVR soft-start current-limited load switch U_SW_DSI, C24593, gated by DSI1_EN with ~OC fault reporting to GPIO9 and 1k output discharge bleeder R_DSI_DIS, C11702, to GND, and J_DSI.20/21 MIPI1_SCL/MIPI1_SDA routed to CM5 SCL0 pin 80 / SDA0 pin 82 per the CM5 IO Board reference design with 1.8k pull-ups R_DSI_SCL/R_DSI_SDA, C25871, referenced to switched 3V3_DSI to prevent back-powering when U_SW_DSI is off) and driven by TI TPS61165DBVR constant-current boost LED driver (with C_BL_IN=10uF 35V X5R 0805 HGC0805R5106K350NSLJ, C33546007, C_BL_COMP=220nF 25V X7R 0402 TCC0402X7R224K250AT, C915854, R_BL_SET=0.91R 1% 0.125W 0805 resistor 0805W8F910LT5E, C17478, setting I_LED = 0.200V / 0.91R = 220 mA for the 3S11P WLED backlight, R_BL_FB=4.7k series current-limiting resistor 0402WGF4701TCE, C25900, and PTVSLC3D3V3B 3.3V low-capacitance TVS clamp D_BL_FB, C246774, protecting U_BL.6 FB on J_BL.2 BL_FB, PTVS36VS1UR,115 36V TVS D_BL_A, C171823, on J_BL.1 BL_LED_A, MBR0560 60V Schottky rectifier D_BL, C77338, and 1uF 50V X7R 0805 output capacitor C_BL_OUT, C91185, rated above the 38V open-LED OVP threshold), dimmed locally on the carrier PCB at U_BL.CTRL by CM5 GPIO18 (BL_PWM with 100k pull-down R_BL_PD) and feeding the panel over 4-pin JST-PH harness J_BL (pin 1 BL_LED_A, pin 2 BL_FB, pins 3-4 GND)"
    quantity: "8.0 in 4:3 IPS (1024x768), 4-lane MIPI DSI + PWM backlight"
  - id: R3
    text: "Standalone resistor-strapped USB-C PD sink on rear port P_PWR negotiating 15 V into a 5 V / 5 A synchronous buck converter feeding all CM5 5 V pins, with CM5_3V3 feeding GPIO_VREF and no conflicting external 3.3 V LDO"
    how_met: "WCH CH224A (C42459160, ESSOP-10 in-stock CH224K family, strapped with R_PD_CFG1=56k 1% RC0402FR-0756KL, C114756, on CFG1 pin 9 to GND to request the mandatory 15 V USB-PD 3.0 fixed PDO, and R_PD_VHV=1k RC isolation resistor 0402WGF1001TCE, C11702, per the CH224A application circuit between VBUS_IN pin 8 and VHV pin 1 with 1uF 50V bypass C_PD_VHV, C15849, keeping unswitched J_PWR VBUS_IN bypass capacitance to C_PD_IN=1uF 50V X7R 0805 CC0805KKX7R9BB105, C91185, so cSnkVBus <= 2.0uF << 10uF USB Type-C limit) gating AO3407A 30V 4.2A P-channel MOSFET high-side load switch Q_PD_SW (C347478, with R_PD_PG=100k C25741 and C_PD_SS=100nF 50V C307331 across Source-Gate and R_PD_PG2=100k C25741 to U_PD.10 PG setting V_GS=-7.50V at 15V with tau_G=5.0ms soft-start and isolating the 67.1uF downstream capacitance until PD negotiation completes) feeding Silergy SY8205FCC (U_BUCK, C111875, 4.5-30V recommended operating input, 33V absolute maximum rating, 5V 5A continuous / 6A peak synchronous buck converter, with R_BUCK_FB1=73.2k 1% 0402WGF7322TCE, C26986, and R_BUCK_FB2=10k 1% 0402WGF1002TCE, C25744, setting V_OUT = 0.600V * (1 + 73.2k/10k) = 4.992V, R_BUCK_EN1=100k, C25741, and R_BUCK_EN2=20k, 0402WGF2002TCE, C25765, and C_BUCK_EN=100nF 50V, C307331, on switched VBUS_PD setting V_BUCK_EN=2.50V at 15.0V and >=2.38V at 14.25V above V_ENH=1.2V with tau_EN=1.67ms RC delay after Q_PD_SW soft-charges VBUS_PD, plus 3x 47uF 10V X5R 0805 output capacitors C_5V1-C_5V3, C2012X5R1A476MTJ00E, C76636, 141uF nominal / ~70uF effective at 5V and 100nF C_5V4, C307331, placed adjacent to L_BUCK.2 and U_BUCK GND pad 9) wired to all six CM5 +5v_(Input) pins (77-87, with PSU_MAX_CURRENT=5000 configured in CM5 bootloader EEPROM) with local 100uF 10V 15mOhm solid polymer bulk decoupling (C_CM5_BULK, SA11AM101A19R15XXX, C135491) and 100nF HF bypass (C_CM5_5V, C307331), and J_PWR protected by TPD4E05U06DQAR (D_ESD_PWR, C138714) on PD_DP/PD_DM, TSD05CDYFR (D_PD_CC1, D_PD_CC2, C20611048) 5.5V ESD diodes on PD_CC1/PD_CC2, PTVS15VS1UR,115 (D_PD_VBUS, C513104, 15V standoff TVS, V_BR=16.7-18.5V, V_CL=24.4V at 16.4A < 30V SY8205FCC operating max and 33V abs max) and 47uF 35V 150mOhm damped tantalum bulk capacitor CA55-D035K476TE150 (C_PD_BULK, C2761441) on 15V VBUS_PD; CM5 +3.3v_(Output) (3V3_CM5) wired directly to GPIO_VREF (pin 78) and carrier pull-ups, while TI TLV62569DBVR (U_3V3, C141836, 5V->3.3V 2A synchronous buck enabled by 3V3_CM5 via R_3V3_EN=10k / R_3V3_EN_PD=100k, equipped with active output discharge Q_3V3_INV/Q_3V3_DIS BSS138 C78284 + R_3V3_DIS=33R C25105 + R_3V3_DIS_PU=10k C25744 to 5V_SYS + 1k bleeder R_3V3_BLEED C11702 discharging 53.1uF in tau=1.85ms when 3V3_CM5 falls, plus B5819W Schottky clamp diode D_3V3_CLAMP C2943878 from 3V3_SYS Anode to 3V3_CM5 Cathode clamping 3V3_SYS <= 3V3_CM5 + 0.25V) supplies 3V3_SYS to front_io (J_FIO.1-2) and LCD panel load switch U_SW_DSI (TPS2051BDBVR, C24593)"
    quantity: "15 V / 3 A PD input -> 5.0 V / 5.0 A buck"
  - id: R4
    text: "Direct service USB-C 2.0 OTG flashing port (P_BOOT) wired straight to CM5 USB2_P/N (pins 105/103) with nRPIBOOT button (pin 93) and USB_OTG_ID bootstrap"
    how_met: "Dedicated rear USB-C receptacle J_BOOT wired directly to CM5 pins 105/103 with USBLC6-2SC6 (D_ESD_BOOT, C2827654) protecting USB2_P/USB2_N and VBUS_BOOT, TSD05CDYFR (D_BOOT_CC1, D_BOOT_CC2, C20611048) 5.5V ESD diodes on BOOT_CC1/BOOT_CC2, rear tactile button SW_BOOT on nRPIBOOT (pin 93) protected by TSD05CDYFR (D_SW_BOOT, C20611048), and USB_OTG_ID (pin 101) relying on CM5 internal pull-ups without conflicting external pull-ups to switched 3V3_CM5"
    quantity: "1x USB-C OTG flashing port + 1x nRPIBOOT button"
