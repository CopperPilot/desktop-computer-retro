  - {refs: [U_PD], role: usb_pd_sink, mpn: CH224A, lcsc: C42459160, footprint: "lcsc:ESSOP-10_L4.9-W3.9-P1.0-LS6.0-TL-EP", description: "Standalone resistor-strapped USB-PD 3.0 sink controller negotiating 15 V via R_PD_CFG1=56k (C114756)"}
  - {refs: [Q_PD_SW], role: pd_vbus_load_switch, mpn: AO3407A, lcsc: C347478, footprint: "lcsc:SOT-23_L2.9-W1.3-P1.90-LS2.4-BR", description: "30V 4.2A P-channel MOSFET high-side VBUS load switch isolating bulk input capacitance until U_PD PG asserts"}
  - {refs: [U_BUCK], role: buck_5v_5a, mpn: SY8205FCC, lcsc: C111875, footprint: "lcsc:SOIC-8_L5.0-W4.0-P1.27-LS6.0-BL-EP2.0", description: "4.5-30V input (33V abs max), 5V 5A continuous / 6A peak synchronous step-down converter"}
  - {refs: [U_3V3], role: buck_3v3_2a, mpn: TLV62569DBVR, lcsc: C141836, footprint: "lcsc:SOT-23-5_L3.0-W1.7-P0.95-LS2.8-BR", description: "2.5-5.5V input, 3.3V 2A high-efficiency synchronous buck regulator supplying 3V3_SYS"}
